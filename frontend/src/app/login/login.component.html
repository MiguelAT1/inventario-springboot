<div style="max-width: 400px; margin: 100px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
  <h2>Login</h2>
  
  <div style="margin-bottom: 15px;">
    <label>Usuario:</label>
    <input 
      type="text" 
      [(ngModel)]="username"
      (keypress)="onKeyPress($event)"
      placeholder="Ingresa tu usuario"
      style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;"
    />
  </div>

  <div style="margin-bottom: 15px;">
    <label>Contraseña:</label>
    <input 
      type="password" 
      [(ngModel)]="password"
      (keypress)="onKeyPress($event)"
      placeholder="Ingresa tu contraseña"
      style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;"
    />
  </div>

  <div *ngIf="error" style="color: red; margin-bottom: 15px;">
    {{ error }}
  </div>

  <button 
    (click)="login()"
    [disabled]="loading"
    style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;"
  >
    {{ loading ? 'Cargando...' : 'Iniciar Sesión' }}
  </button>
</div>
